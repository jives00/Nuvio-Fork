name: Upstream Sync

on:
  schedule:
    - cron: '0 8 * * *'  # daily at 8am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT (not GITHUB_TOKEN) so the push to dev triggers build-apk.yml.
          # GITHUB_TOKEN-driven pushes are deliberately suppressed by GitHub and
          # never fire downstream workflow runs.
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioTV.git
          git fetch upstream

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list HEAD..upstream/dev --count 2>/dev/null || git rev-list HEAD..upstream/main --count)
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          if git rev-parse upstream/dev &>/dev/null; then
            echo "upstream_branch=dev" >> "$GITHUB_OUTPUT"
          else
            echo "upstream_branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt merge
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          if git merge "upstream/${{ steps.check.outputs.upstream_branch }}" --no-edit; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-resolve known fork conflicts
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.success == 'false'
        id: resolve
        run: |
          CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
          echo "Conflicting files: $CONFLICT_FILES"

          if [ "$CONFLICT_FILES" = "app/build.gradle.kts" ]; then
            python3 scripts/resolve_upstream_conflict.py
            git add app/build.gradle.kts
            git commit -m "chore: merge upstream/${{ steps.check.outputs.upstream_branch }} (auto-resolved fork conflicts)"
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore our workflow files post-merge
        if: steps.check.outputs.behind != '0' && (steps.merge.outputs.success == 'true' || steps.resolve.outputs.resolved == 'true')
        run: |
          # GITHUB_TOKEN cannot push changes to .github/workflows/ — restore ours.
          # We don't want upstream's CI workflows anyway.
          git checkout HEAD~1 -- .github/workflows/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore fork workflow files (GITHUB_TOKEN restriction)"
          fi

      - name: Push
        if: steps.check.outputs.behind != '0' && (steps.merge.outputs.success == 'true' || steps.resolve.outputs.resolved == 'true')
        run: |
          git push origin dev

      - name: Open conflict PR and notify
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.success == 'false' && steps.resolve.outputs.resolved != 'true'
        env:
          # GITHUB_TOKEN can't create PRs unless the repo setting for it is enabled;
          # SYNC_PAT (already used for checkout/push above) has real permissions.
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          git merge --abort
          BRANCH="upstream-sync/conflict-$(date +%Y%m%d)"
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -B "$BRANCH"
          git merge "upstream/${{ steps.check.outputs.upstream_branch }}" --no-edit || true
          git add -A
          git commit -m "chore: upstream sync conflict $(date +%Y-%m-%d) [needs manual resolution]"
          git push --force origin "$BRANCH"
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --json url --jq '.[0].url' || true)
          if [ -n "$EXISTING_PR" ]; then
            PR_URL="$EXISTING_PR"
          else
            PR_URL=$(gh pr create \
              --title "Upstream sync conflict -- $(date +%Y-%m-%d)" \
              --body "Automatic upstream sync failed due to merge conflicts outside of known auto-resolvable files. Resolve conflicts and merge this PR manually to trigger a build." \
              --draft \
              --base dev \
              --head "$BRANCH" \
              --repo "${{ github.repository }}")
          fi
          echo "pr_url=${PR_URL}" >> "$GITHUB_ENV"

      - name: Send conflict notification email
        if: steps.check.outputs.behind != '0' && steps.merge.outputs.success == 'false' && steps.resolve.outputs.resolved != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: jbromberek@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: jbromberek@gmail.com
          from: Nuvio Fork CI <jbromberek@gmail.com>
          subject: "NuvioFork upstream sync needs manual merge"
          body: |
            Upstream sync failed due to conflicts that could not be auto-resolved.

            A draft PR has been opened with the conflicting files:
            ${{ env.pr_url }}

            Once resolved and merged, trigger the APK build manually.
