name: Build and Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write local.properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties

      - name: Restore debug keystore
        # Uses a stored keystore so the signing cert stays consistent across builds.
        # Consistent signing is required for OTA installs — mismatched certs block installation.
        env:
          FORK_DEBUG_KEYSTORE_BASE64: ${{ secrets.FORK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$FORK_DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          CI_USE_DEBUG_SIGNING: "true"
        run: ./gradlew assemblefullRelease --no-daemon -x lint

      - name: Rename APK
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          APK_NAME="NuvioFork-${VERSION}.apk"
          cp app/build/outputs/apk/full/release/app-full-universal-release.apk "${APK_NAME}"
          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          APK="${{ steps.apk.outputs.name }}"
          gh release create "${VERSION}" "${APK}" \
            --title "Fork ${VERSION}" \
            --notes "Auto-built fork APK for version ${VERSION}." \
            --repo "${{ github.repository }}"

