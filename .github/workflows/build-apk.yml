name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write local.properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties

      - name: Restore release keystore
        # Explicit, stable release keystore stored as a secret. Signing with a fixed
        # cert is required for OTA installs — every build must share one signature or
        # Android rejects the update with "App not installed".
        # (The old debug-keystore approach was unreliable: AGP auto-regenerated a fresh
        # debug key per build, so each release was signed with a different cert.)
        env:
          FORK_RELEASE_KEYSTORE_BASE64: ${{ secrets.FORK_RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$FORK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fork-release.jks"

      - name: Read version
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          NUVIO_RELEASE_STORE_FILE: ${{ runner.temp }}/fork-release.jks
          NUVIO_RELEASE_KEY_ALIAS: ${{ secrets.FORK_RELEASE_KEY_ALIAS }}
          NUVIO_RELEASE_KEY_PASSWORD: ${{ secrets.FORK_RELEASE_KEY_PASSWORD }}
          NUVIO_RELEASE_STORE_PASSWORD: ${{ secrets.FORK_RELEASE_STORE_PASSWORD }}
        run: ./gradlew assemblefullRelease --no-daemon -x lint

      - name: Rename APK
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          APK_NAME="NuvioFork-${VERSION}.apk"
          cp app/build/outputs/apk/full/release/app-full-universal-release.apk "${APK_NAME}"
          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          APK="${{ steps.apk.outputs.name }}"
          # Version tracks upstream, so the same version is rebuilt on repeated pushes.
          # Replace any existing release+tag so the latest build always wins.
          gh release delete "${VERSION}" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release create "${VERSION}" "${APK}" \
            --title "Fork ${VERSION}" \
            --notes "Auto-built fork APK for version ${VERSION}." \
            --repo "${{ github.repository }}"

