name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write local.properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties

      - name: Build APK
        env:
          CI_USE_DEBUG_SIGNING: "true"
        run: ./gradlew assemblefullRelease --no-daemon -x lint

      - name: Rename APK
        id: apk
        run: |
          TIMESTAMP=$(date -u +'%m%d%Y-%H%M')
          APK_NAME="NuvioFork-${TIMESTAMP}.apk"
          cp app/build/outputs/apk/full/release/app-full-universal-release.apk "${APK_NAME}"
          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 7

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: jbromberek@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: jbromberek@gmail.com
          from: Nuvio Fork CI <jbromberek@gmail.com>
          subject: "NuvioFork APK build complete — ${{ steps.apk.outputs.name }}"
          body: |
            Build succeeded for ${{ steps.apk.outputs.name }}.

            Download (requires GitHub login):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The APK is inside a .zip artifact named ${{ steps.apk.outputs.name }}.
